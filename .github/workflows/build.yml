name: Acer One 8 T4-82L LOS20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LOS20
        run: |
          mkdir -p "$GITHUB_WORKSPACE/los20"
          cd "$GITHUB_WORKSPACE/los20"

          repo init \
            --no-repo-verify \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0

      - name: Add Acer manifest
        run: |
          cd "$GITHUB_WORKSPACE/los20"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/acer.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <project
                  name="codebht/Android_device_t482l"
                  path="device/acer/AcerOne8T482L"
                  remote="github"
                  revision="main" />

              <project
                  name="codebht/android_vendor_T482L"
                  path="vendor/acer/AcerOne8T482L"
                  remote="github"
                  revision="main" />
          </manifest>
          EOF
            - name: Check workspace storage
        run: |
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE"
          df -h /
          echo "Current workspace usage:"
          du -sh "$GITHUB_WORKSPACE" || true

      - name: Sync
        run: |
          cd "$GITHUB_WORKSPACE/los20"
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --current-branch

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/los20"
          source build/envsetup.sh
          lunch lineage_AcerOne8T482L-userdebug
          m bacon -j2

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AcerOne8T482L-LOS20
          path: |
            ${{ github.workspace }}/los20/out/target/product/AcerOne8T482L/*.zip
            ${{ github.workspace }}/los20/out/target/product/AcerOne8T482L/*.img